<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMITE 2 | High Council Hub</title>

    <!-- This block loads the typefaces that carry the marble-and-gold
         mythology styling across headings, labels, and body copy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Forum&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- This block loads the shared stylesheet for the full custom frontend. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- This block provides a shell for the single-page app. The backend only
         renders the frame; the frontend JavaScript fills in the live content. -->
    <div class="app-shell app-shell-v2">
        <aside class="council-rail">
            <div class="brand-lockup">
                <div class="brand-mark">HC</div>
                <div>
                    <div class="brand-title">High Council</div>
                    <div class="brand-subtitle">SMITE 2 Friend Hub</div>
                </div>
            </div>

            <nav class="rail-nav" id="tab-strip">
                <button class="tab-btn active" data-tab="index" data-mobile-label="Gods"><span>Gods</span></button>
                <button class="tab-btn" data-tab="rater-stats" data-mobile-label="Raters"><span>Rater Profile</span></button>
                <button class="tab-btn" data-tab="chemistry" data-mobile-label="Chem"><span>Chemistry</span></button>
                <button class="tab-btn" data-tab="analytics" data-mobile-label="Data"><span>Analytics</span></button>
                <button class="tab-btn" data-tab="h2h" data-mobile-label="H2H"><span>H2H</span></button>
                <button class="tab-btn" data-tab="council-scroll" data-mobile-label="Scroll"><span>Council Scroll</span></button>
                <button class="tab-btn" data-tab="ranker" data-mobile-label="Rank"><span>Rate &amp; Rank</span></button>
            </nav>

            <div class="rail-status rail-admin-link">
                <button class="tab-btn rail-admin-btn" data-tab="data-health" data-mobile-label="Health"><span>Data Health</span></button>
            </div>
        </aside>

        <main class="main-column main-v2">
            <header class="topbar-v2">
                <div>
                    <p class="eyebrow">The Hall Of Olympus</p>
                    <h1>High Council Hub</h1>
                    <p class="hero-text">Council ratings, match receipts, and the gods your group actually wins with.</p>
                </div>
                <div class="topbar-stat-row" id="hero-stats"></div>
            </header>

            <div id="status-banner"></div>

            <section class="filter-panel-v2" id="filters-details">
                <form id="filters-form" class="filters-grid filters-grid-v2">
                    <label class="field field-search">
                        <span>Search God</span>
                        <input id="filter-search" type="text" placeholder="Type to narrow gods: ix, zeus, support..." autocomplete="off">
                    </label>

                    <label class="field">
                        <span>Role</span>
                        <select id="filter-role"></select>
                    </label>

                    <label class="field">
                        <span>Class</span>
                        <select id="filter-class"></select>
                    </label>

                    <label class="field">
                        <span>Pantheon</span>
                        <select id="filter-pantheon"></select>
                    </label>

                    <label class="field">
                        <span>Attack Type</span>
                        <select id="filter-attack-type"></select>
                    </label>

                    <label class="field">
                        <span>Damage Type</span>
                        <select id="filter-damage-type"></select>
                    </label>

                    <div class="filter-actions">
                        <button class="btn-primary" type="submit">Apply</button>
                        <button class="btn-secondary" id="filters-reset" type="button">Clear</button>
                    </div>
                </form>
            </section>

            <section class="tab-content">
                <section class="tab-panel active" id="tab-index"></section>
                <section class="tab-panel" id="tab-rankings"></section>
                <section class="tab-panel" id="tab-favorites"></section>
                <section class="tab-panel" id="tab-rater-stats"></section>
                <section class="tab-panel" id="tab-chemistry"></section>
                <section class="tab-panel" id="tab-tierlist"></section>
                <section class="tab-panel" id="tab-analytics"></section>
                <section class="tab-panel" id="tab-h2h"></section>
                <section class="tab-panel" id="tab-data-health"></section>
                <section class="tab-panel" id="tab-council-scroll"></section>
                <section class="tab-panel" id="tab-ranker"></section>
            </section>
        </main>
    </div>

    <div class="god-modal-backdrop hidden" id="god-modal-backdrop">
        <section class="god-detail-modal" role="dialog" aria-modal="true" aria-label="God details">
            <button class="modal-close" id="god-modal-close" type="button" aria-label="Close god details">&times;</button>
            <div id="god-modal-content"></div>
        </section>
    </div>

    <!-- This block loads the frontend controller that fetches bootstrap data,
         renders all tabs, and manages rank-editing interactions. -->
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
